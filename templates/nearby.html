{% extends "layout.html" %}

{% block content %}

<section class="page-header nearby-page-header">
    <h1>Nearby Me</h1>
    <p>Find the nearest clinics within Bacolod City</p>
</section>

<section class="nearby-search-section">
    <div class="hero-search-row nearby-control-row">
        <div class="hero-search">
            <input
                type="text"
                id="nearbySearchInput"
                placeholder="Search clinic, address, or service..."
            >
        </div>

        <select id="nearbyServiceSelect" class="hero-service-select">
            <option value="">All Services</option>
            <option value="Dental">Dental</option>
            <option value="Check-up">Check-up</option>
            <option value="Vaccination">Vaccination</option>
            <option value="Anti-Rabies">Anti-Rabies</option>
            <option value="Dog Bite / Anti-Rabies">Dog Bite / Anti-Rabies</option>
            <option value="Laboratory">Laboratory</option>
            <option value="Dialysis">Dialysis</option>
            <option value="Pediatric">Pediatric</option>
            <option value="OB-GYN">OB-GYN</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Health Center">Health Center</option>
        </select>

        <button type="button" id="nearbySearchButton" class="hero-search-btn">
            Search
        </button>

        <button type="button" onclick="findNearbyMe()" class="nearby-location-btn">
            Use My Location
        </button>
    </div>
</section>

<section class="nearby-map-section">
    <div class="map-card nearby-map-card">
        <div id="map"></div>
    </div>
</section>

<section class="clinic-carousel-section nearby-results-section">
    <div class="carousel-header">
        <div>
            <h2>Nearby Clinics <span id="clinicCount"></span></h2>
            <p id="resultText">Click “Use My Location” to begin.</p>
        </div>

        <div class="carousel-controls">
            <button type="button" onclick="changeClinicPage(currentClinicPage - 1)">‹</button>
            <button type="button" onclick="changeClinicPage(currentClinicPage + 1)">›</button>
        </div>
    </div>

    <div
        id="clinicList"
        class="clinic-list clinic-carousel-grid nearby-clinic-grid"
        data-page-size="9"
    ></div>

    <div id="clinicPagination" class="clinic-pagination"></div>
</section>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <button type="button" class="close-btn" onclick="closeDetails()">×</button>

        <div class="detail-map-strip">
            <div class="detail-pin">📍</div>
        </div>

        <h2 id="detailName"></h2>

        <p id="detailRating" class="clinic-rating"></p>

        <div class="detail-item">
            <span>📍</span>
            <div>
                <small>Address</small>
                <p id="detailAddress"></p>
            </div>
        </div>

        <div class="detail-item">
            <span>📞</span>
            <div>
                <small>Contact Number</small>
                <p id="detailContact"></p>
            </div>
        </div>

        <div class="detail-item">
            <span>🕒</span>
            <div>
                <small>Status & Hours</small>
                <p id="detailStatus"></p>
                <p id="detailHours"></p>
                <p id="detailDays"></p>
            </div>
        </div>

        <h4>Available Services</h4>
        <div id="detailServices" class="service-tags"></div>

        <div class="modal-actions">
            <button type="button" onclick="viewOnMap()" class="primary-btn">View on Map</button>
            <button type="button" onclick="getDirections()" class="outline-btn">Get Directions</button>
        </div>
    </div>
</div>

{% endblock %}
